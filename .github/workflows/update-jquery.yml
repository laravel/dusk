name: 'update jquery'

on:
  push:
    paths:
      - 'package-lock.json'
  pull_request:
    paths:
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 16

      - name: Copy jQuery from node_module
        run: |
          npm ci
          cp ./node_modules/jquery/dist/jquery.min.js ./bin/jquery.js

      - name: Commit compiled files
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: Update `jquery.js`
