name: 'update jquery'

on:
  push:
    paths:
      - 'package-lock.json'
  pull_request:
    paths:
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 16

      - name: Copy jQuery from node_module
        run: |
          npm ci
          cp ./node_modules/jquery/dist/jquery.min.js ./bin/jquery.js

      - name: Commit compiled files
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: Update `jquery.js`
